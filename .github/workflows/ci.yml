name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: financial_services_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d financial_services_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/financial_services_test
      JWT_SECRET: ci-only-secret-that-is-at-least-thirty-two-characters
      APP_BASE_URL: http://localhost:3000
      STORAGE_TYPE: local
      LOCAL_UPLOAD_DIR: /tmp/financial-services-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npx prisma migrate status
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - run: docker build --tag financial-services:ci .
